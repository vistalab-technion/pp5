name: pp5
channels:
  - conda-forge
  - defaults
  - schrodinger # pymol
  - bioconda # clustal, muscle, blast
  - salilab # dssp
  - r # some R packages
dependencies:
  # Basic
  - pip
  # - python=3.9.*
  - python=3.11.*
  # Development
  # Project Dependencies
  - biopython<1.85
  - black
  - blast
  - clustalo
  - dssp
  - ipython
  - jupyter
  - jupyterlab
  - matplotlib
  - more-itertools
  - muscle
  - nglview
  - nodejs
  - numba
  - numpy
  - pandas<3
  - pre-commit
  - pymol-bundle
  - pytest
  - pytest-benchmark
  - pytest-cov
  - pytest-repeat
  - pytest-xdist
  - requests
  - rpy2
  - scikit-learn<1.6
  - scipy<1.15
  - seaborn
  - toml
  - tqdm
  - uncertainties
  # r-dependencies (for torustest)
  - r-doparallel
  - r-fraction
  - r-ggplot2
  - r-pracma
  - r-proxy
  - r-transport
  # pip dependencies
  - pip:
      - nbmerge
      - -e . # install this package
platforms:
  - linux-64
  - osx-64
